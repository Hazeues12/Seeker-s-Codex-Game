      - name: Install Godot 4.4.1 and Web export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true
      - name: Check game imports and starts without errors
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s godot --headless --path . --editor --import --quit 2>&1 | tee v051-import.log
          if grep -E 'ERROR:|SCRIPT ERROR:|Parse Error' v051-import.log; then exit 1; fi
          timeout 90s godot --headless --path . --quit-after 180 2>&1 | tee v051-startup.log
          if grep -E 'ERROR:|SCRIPT ERROR:|Parse Error' v051-startup.log; then exit 1; fi
      - name: Test existing saves missions and new daily civic state
        shell: bash
        run: |
          set -euo pipefail
          for spec in 'v044_relationship|V0.44 SOCIAL MEMORY SMOKE PASS' 'v048_field|V0.48 FIELD MISSION STATE SMOKE PASS' 'v049_companion|V0.49 COMPANION STATE SMOKE PASS' 'v050_expedition|V0.50 MULTI-DAY EXPEDITION SMOKE PASS' 'v051_city|V0.51 DAILY CITY MEMORY SMOKE PASS'; do
            scene="${spec%%|*}"
            expected="${spec#*|}"
            timeout 45s godot --headless --path . "res://tests/${scene}_scene.tscn" --quit-after 220 2>&1 | tee "${scene}.log"
            if grep -E 'ERROR:|SCRIPT ERROR:|Parse Error' "${scene}.log"; then exit 1; fi
            grep -Fq "$expected" "${scene}.log" || { echo "Required regression marker missing: $scene"; exit 1; }
          done
      - name: Export internal development Web build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/web
          timeout 130s godot --headless --path . --export-release Web build/web/index.html 2>&1 | tee v051-export.log
          if grep -E 'ERROR:|SCRIPT ERROR:|Parse Error' v051-export.log; then exit 1; fi
          for ext in html js wasm pck; do test -s "build/web/index.$ext"; done
      - name: Commit validated gameplay only to development branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add systems/city_routines_v051.gd world/daily_events_v051.gd world/ring_two_daily_life.gd world/quarter_life.gd systems/hub_manager.gd characters/player_controller.gd scenes/main.tscn systems/personal_codex.gd tests/v051_city_scene.tscn tests/v051_city_smoke.gd docs/V051_FEATURES.md
          if ! git diff --cached --quiet; then
            git commit -m 'V0.51 deterministic civic schedules and daily consequence bulletins'
            git pull --rebase origin codex-modular-v31
            git push origin HEAD:codex-modular-v31
          fi
      - name: Retain development Web export for later release
        uses: actions/upload-artifact@v4
        with:
          name: seeker-codex-v051-dev-web
          path: build/web/
          if-no-files-found: error
      - name: Save failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: margerina-v051-diagnostics
          if-no-files-found: ignore
          path: |
            v051-import.log
            v051-startup.log
            v051-export.log
            v044_relationship.log
            v048_field.log
            v049_companion.log
            v050_expedition.log
            v051_city.log