name: Margerina V0.49 Companion Trust and Tactical Field Combat
on:
  push:
    branches: [codex-modular-v31]
    paths: ['.github/workflows/margerina-v049.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate-companions:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - name: Checkout development branch only
        uses: actions/checkout@v4
        with:
          ref: codex-modular-v31
          persist-credentials: true
      - name: Apply guarded V0.49 changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYINSTALL'
          from pathlib import Path
          import json
          generated = json.loads("{\"systems/companion_state_v049.gd\":\"extends RefCounted\\n# V0.49 — game-only volunteer field partner. Not a canonical character.\\n# Deterministic state for bounded loyalty, injury and once-per-day recovery.\\nconst MAX_INJURY: int = 100\\nconst MAX_INTERCEPTIONS: int = 3\\nconst FIELD_OUTCOMES: Array[String] = [\\\"protect_civilians\\\", \\\"secure_evidence\\\"]\\n\\nstatic func fresh() -> Dictionary:\\n    return {\\\"version\\\": 1, \\\"loyalty\\\": 0, \\\"injury\\\": 0, \\\"interventions\\\": 0, \\\"last_rest_day\\\": -1, \\\"outcome\\\": \\\"\\\"}\\n\\nstatic func sanitize(value: Variant) -> Dictionary:\\n    var clean: Dictionary = fresh()\\n    if typeof(value) != TYPE_DICTIONARY:\\n        return clean\\n    clean[\\\"loyalty\\\"] = clampi(int(value.get(\\\"loyalty\\\", 0)), -3, 3)\\n    clean[\\\"injury\\\"] = clampi(int(value.get(\\\"injury\\\", 0)), 0, MAX_INJURY)\\n    clean[\\\"interventions\\\"] = clampi(int(value.get(\\\"interventions\\\", 0)), 0, MAX_INTERCEPTIONS)\\n    clean[\\\"last_rest_day\\\"] = clampi(int(value.get(\\\"last_rest_day\\\", -1)), -1, 999999)\\n    var outcome: String = str(value.get(\\\"outcome\\\", \\\"\\\"))\\n    clean[\\\"outcome\\\"] = outcome if FIELD_OUTCOMES.has(outcome) else \\\"\\\"\\n    return clean\\n\\nstatic func absorb_field_hit(value: Dictionary, damage: int) -> Dictionary:\\n    var data: Dictionary = sanitize(value)\\n    if damage <= 0 or int(data[\\\"injury\\\"]) >= 65 or int(data[\\\"interventions\\\"]) >= MAX_INTERCEPTIONS or int(data[\\\"loyalty\\\"]) <= -3:\\n        return {}\\n    data[\\\"interventions\\\"] = int(data[\\\"interventions\\\"]) + 1\\n    data[\\\"injury\\\"] = mini(MAX_INJURY, int(data[\\\"injury\\\"]) + maxi(9, int(ceil(float(damage) * 1.4))))\\n    return data\\n\\nstatic func recover_once(value: Dictionary, game_day: int) -> Dictionary:\\n    var data: Dictionary = sanitize(value)\\n    if game_day < 1 or int(data[\\\"injury\\\"]) <= 0 or game_day <= int(data[\\\"last_rest_day\\\"]):\\n        return {}\\n    data[\\\"injury\\\"] = maxi(0, int(data[\\\"injury\\\"]) - 24)\\n    data[\\\"last_rest_day\\\"] = game_day\\n    return data\\n\\nstatic func resolve_outcome(value: Dictionary, outcome: String) -> Dictionary:\\n    var data: Dictionary = sanitize(value)\\n    if not FIELD_OUTCOMES.has(outcome) or not str(data[\\\"outcome\\\"]).is_empty():\\n        return {}\\n    data[\\\"outcome\\\"] = outcome\\n    if outcome == \\\"protect_civilians\\\":\\n        data[\\\"loyalty\\\"] = clampi(int(data[\\\"loyalty\\\"]) + 2, -3, 3)\\n    else:\\n        data[\\\"loyalty\\\"] = clampi(int(data[\\\"loyalty\\\"]) + 1, -3, 3)\\n    return data\\n\",\"tests/v049_companion_scene.tscn\":\"[gd_scene load_steps=2 format=3]\\n[ext_resource type=\\\"Script\\\" path=\\\"res://tests/v049_companion_smoke.gd\\\" id=\\\"1\\\"]\\n[node name=\\\"CompanionSmokeTest\\\" type=\\\"Node\\\"]\\nscript = ExtResource(\\\"1\\\")\\n\",\"tests/v049_companion_smoke.gd\":\"extends Node\\nconst Rules = preload(\\\"res://systems/companion_state_v049.gd\\\")\\nfunc _ready() -> void:\\n    call_deferred(\\\"_run\\\")\\nfunc _reject(reason: String) -> void:\\n    push_error(\\\"V0.49 COMPANION TEST FAILED: \\\" + reason)\\n    get_tree().call_deferred(\\\"quit\\\", 1)\\nfunc _run() -> void:\\n    var state: Dictionary = Rules.fresh()\\n    if not Rules.recover_once(state, 1).is_empty():\\n        _reject(\\\"cannot recover without an injury\\\")\\n        return\\n    for i in range(3):\\n        var next: Dictionary = Rules.absorb_field_hit(state, 14)\\n        if next.is_empty():\\n            _reject(\\\"valid interception rejected\\\")\\n            return\\n        state = next\\n    if int(state[\\\"interventions\\\"]) != 3 or int(state[\\\"injury\\\"]) != 60:\\n        _reject(\\\"interception cost or count\\\")\\n        return\\n    if not Rules.absorb_field_hit(state, 14).is_empty():\\n        _reject(\\\"interception limit bypass\\\")\\n        return\\n    var recovered: Dictionary = Rules.recover_once(state, 1)\\n    if int(recovered.get(\\\"injury\\\", -1)) != 36 or not Rules.recover_once(recovered, 1).is_empty():\\n        _reject(\\\"recovery cap or same-day duplication\\\")\\n        return\\n    recovered = Rules.recover_once(recovered, 2)\\n    if int(recovered.get(\\\"injury\\\", -1)) != 12:\\n        _reject(\\\"next-day recovery\\\")\\n        return\\n    var loyal: Dictionary = Rules.resolve_outcome(recovered, \\\"protect_civilians\\\")\\n    if int(loyal.get(\\\"loyalty\\\", -1)) != 2:\\n        _reject(\\\"loyalty consequence\\\")\\n        return\\n    if not Rules.resolve_outcome(loyal, \\\"secure_evidence\\\").is_empty():\\n        _reject(\\\"exclusive mission outcome bypass\\\")\\n        return\\n    var saved: Dictionary = Rules.sanitize(JSON.parse_string(JSON.stringify(loyal)))\\n    if saved != loyal:\\n        _reject(\\\"persistent JSON round trip\\\")\\n        return\\n    var bad: Dictionary = Rules.sanitize({\\\"loyalty\\\": 100, \\\"injury\\\": -10, \\\"interventions\\\": 99, \\\"outcome\\\": \\\"forbidden\\\"})\\n    if int(bad[\\\"loyalty\\\"]) != 3 or int(bad[\\\"injury\\\"]) != 0 or int(bad[\\\"interventions\\\"]) != 3 or str(bad[\\\"outcome\\\"]) != \\\"\\\":\\n        _reject(\\\"untrusted save bounds\\\")\\n        return\\n    var no_hit: Dictionary = Rules.absorb_field_hit(Rules.fresh(), -1)\\n    if not no_hit.is_empty():\\n        _reject(\\\"negative damage\\\")\\n        return\\n    print(\\\"V0.49 COMPANION STATE SMOKE PASS\\\")\\n    get_tree().call_deferred(\\\"quit\\\", 0)\\n\",\"docs/V049_FEATURES.md\":\"# Margerina V0.49 — Companion Trust, Injury & Adaptive Field Threat\\nDevelopment-only extension on top of verified V0.48. No finished game release and no player playtest required.\\n\\n## Companion persistence\\n- Game-only volunteer partner remains the same V0.48 field companion. Loyalty (-3 to 3), injury (0 to 100), interventions and recovery date persist in the existing Personal Codex JSON under `companion_v049`.\\n- During the field fight, the companion can intercept up to three valid enemy attacks, sustaining injury instead of the player. Interception stops after the cap or if the partner is too wounded. The partner provides reduced support while injured.\\n- After a completed mission, the partner's trust responds to the actual civilian/evidence outcome once. No repeating the dialogue to farm loyalty.\\n- At dispatch after mission completion, the player can arrange recovery that removes 24 injury at most once per in-game day, preserving injury across reloads.\\n\\n## Enemy response\\n- Rogue field automaton tracks rapid repeated hits and can guard when pressured, instead of repeating the same stagger pattern. Original sparring constructs retain their separate training behavior.\\n\\n## Canon & releases\\n- Roles, dialogue and numbers are game-only prototypes. No new canonical characters, official Seeker ranks, forced romance, Eye abilities, Soul Bloom, Spirit Bloom, or Citadel access are created.\\n- The new file extends `user://seeker_profile_v1.json`, preserving its schema and the V0.33 Tola, quest and appearance saves.\\n- V0.49 workflow: import, startup, V0.44 & V0.46 & V0.48 regression tests, V0.49 bounded-state save test, Web export, and commit to development branch only after all pass.\\n- Browser artifact is retained for developer rollback. User requested to wait for a substantially finished release before playing.\\n\"}")
          patches = json.loads("[{\"path\":\"systems/field_mission_v048.gd\",\"old\":\"const Rules = preload(\\\"res://systems/field_rules_v048.gd\\\")\",\"new\":\"const Rules = preload(\\\"res://systems/field_rules_v048.gd\\\")\\nconst CompanionRules = preload(\\\"res://systems/companion_state_v049.gd\\\")\"},{\"path\":\"systems/field_mission_v048.gd\",\"old\":\"var state: Dictionary = {}\\nvar enemy: CharacterBody3D\",\"new\":\"var state: Dictionary = {}\\nvar companion_state: Dictionary = {}\\nvar enemy: CharacterBody3D\"},{\"path\":\"systems/field_mission_v048.gd\",\"old\":\"    state = Rules.sanitize(codex.profile.get(\\\"field_mission_v048\\\", {}))\\n    _make_markers()\",\"new\":\"    state = Rules.sanitize(codex.profile.get(\\\"field_mission_v048\\\", {}))\\n    companion_state = CompanionRules.sanitize(codex.profile.get(\\\"companion_v049\\\", {}))\\n    _make_markers()\"},{\"path\":\"systems/field_mission_v048.gd\",\"old\":\"    label.text = \\\"VOLUNTEER PATROL PARTNER / GAME-ONLY\\\"\",\"new\":\"    label.name = \\\"CompanionStatus\\\"\\n    label.text = \\\"VOLUNTEER PATROL PARTNER / GAME-ONLY\\\"\"},{\"path\":\"systems/field_mission_v048.gd\",\"old\":\"            elif stage == \\\"complete\\\":\\n                _tell(\\\"Filed report: %s. The assignment has already paid out.\\\" % str(state.get(\\\"choice\\\", \\\"\\\")))\\n            else:\\n                _tell(\\\"Continue the field watch. Your partner is keeping pace.\\\")\",\"new\":\"            elif stage == \\\"complete\\\":\\n                if int(companion_state.get(\\\"injury\\\", 0)) > 0:\\n                    _open_panel(\\\"The assignment is filed. The volunteer partner needs recovery time. Injury %d/100.\\\" % int(companion_state.get(\\\"injury\\\", 0)), [{\\\"action\\\": \\\"rest_companion\\\", \\\"label\\\": \\\"Arrange recovery (once per game day)\\\"}])\\n                else:\\n                    _tell(\\\"Filed report: %s. Partner recovered.\\\" % str(state.get(\\\"choice\\\", \\\"\\\")))\\n            else:\\n                _tell(\\\"Continue the field watch. Your partner is keeping pace.\\\")\"},{\"path\":\"systems/field_mission_v048.gd\",\"old\":\"func _act(action: String) -> void:\\n    _close_panel()\\n    var next: Dictionary = Rules.advance(state, action)\",\"new\":\"func _act(action: String) -> void:\\n    _close_panel()\\n    if action == \\\"rest_companion\\\":\\n        if str(state.get(\\\"stage\\\", \\\"\\\")) != \\\"complete\\\" or not is_instance_valid(hub):\\n            _tell(\\\"Return to dispatch after filing your report.\\\")\\n            return\\n        var game_day: int = int(floor(float(hub.get(\\\"world_minutes\\\")) / 1440.0)) + 1\\n        var recovered: Dictionary = CompanionRules.recover_once(companion_state, game_day)\\n        if recovered.is_empty():\\n            _tell(\\\"The partner already recovered today. Another game day is required.\\\")\\n            return\\n        companion_state = recovered\\n        _persist_companion()\\n        _tell(\\\"Your partner rested and recovered. Injury now %d/100.\\\" % int(companion_state[\\\"injury\\\"]))\\n        return\\n    var next: Dictionary = Rules.advance(state, action)\"},{\"path\":\"systems/field_mission_v048.gd\",\"old\":\"func _enemy_knocked_out() -> void:\",\"new\":\"# Only field-attacks may be intercepted; the original training arena remains unchanged.\\nfunc intercept_field_attack(amount: int) -> bool:\\n    if str(state.get(\\\"stage\\\", \\\"\\\")) != \\\"engage\\\" or not is_instance_valid(companion) or not is_instance_valid(player) or not is_instance_valid(enemy):\\n        return false\\n    if companion.global_position.distance_to(player.global_position) > 3.2 or companion.global_position.distance_to(enemy.global_position) > 4.5:\\n        return false\\n    var next: Dictionary = CompanionRules.absorb_field_hit(companion_state, amount)\\n    if next.is_empty():\\n        return false\\n    companion_state = next\\n    _persist_companion()\\n    _tell(\\\"Your partner intercepted a blow and was injured (%d/100).\\\" % int(companion_state[\\\"injury\\\"]))\\n    return true\\n\\nfunc _persist_companion() -> void:\\n    if not is_instance_valid(codex) or bool(codex.get(\\\"save_blocked\\\")):\\n        return\\n    codex.profile[\\\"companion_v049\\\"] = companion_state.duplicate(true)\\n    codex.call(\\\"_save_profile\\\")\\n    _ensure_state_visuals()\\n\\nfunc _enemy_knocked_out() -> void:\"},{\"path\":\"systems/field_mission_v048.gd\",\"old\":\"    if is_instance_valid(saved_status):\\n        saved_status.text = \\\"FIELD WATCH: \\\" + stage.to_upper().replace(\\\"_\\\", \\\" \\\")\",\"new\":\"    if is_instance_valid(saved_status):\\n        saved_status.text = \\\"FIELD WATCH: \\\" + stage.to_upper().replace(\\\"_\\\", \\\" \\\")\\n    if is_instance_valid(companion):\\n        var partner_tag: Label3D = companion.get_node_or_null(\\\"CompanionStatus\\\") as Label3D\\n        if is_instance_valid(partner_tag):\\n            partner_tag.text = \\\"VOLUNTEER / TRUST %d / INJURY %d\\\" % [int(companion_state.get(\\\"loyalty\\\", 0)), int(companion_state.get(\\\"injury\\\", 0))]\"},{\"path\":\"systems/field_mission_v048.gd\",\"old\":\"    elif distance > 1.7:\\n        companion.global_position = companion.global_position.move_toward(desired, minf(3.7 * delta, distance))\",\"new\":\"    elif distance > 1.7:\\n        var follow_speed: float = 2.1 if int(companion_state.get(\\\"injury\\\", 0)) >= 50 else 3.7\\n        companion.global_position = companion.global_position.move_toward(desired, minf(follow_speed * delta, distance))\"},{\"path\":\"systems/field_mission_v048.gd\",\"old\":\"    if stage == \\\"engage\\\" and is_instance_valid(enemy) and bool(enemy.call(\\\"is_active\\\")) and companion_support_wait <= 0.0:\",\"new\":\"    if stage == \\\"engage\\\" and int(companion_state.get(\\\"injury\\\", 0)) < 60 and is_instance_valid(enemy) and bool(enemy.call(\\\"is_active\\\")) and companion_support_wait <= 0.0:\"},{\"path\":\"systems/field_mission_v048.gd\",\"old\":\"    if is_instance_valid(hub) and hub.has_method(\\\"award_field_payout_once\\\"):\",\"new\":\"    var partner_update: Dictionary = CompanionRules.resolve_outcome(companion_state, choice)\\n    if not partner_update.is_empty():\\n        companion_state = partner_update\\n        _persist_companion()\\n        codex.call(\\\"record_event\\\", \\\"v049:partner:field_choice\\\", \\\"companion_bond\\\",\\n            \\\"Your volunteer partner remembers the field decision\\\",\\n            \\\"The partner's trust reflects your recorded choice during the public-quarter watch.\\\")\\n    if is_instance_valid(hub) and hub.has_method(\\\"award_field_payout_once\\\"):\"},{\"path\":\"combat/combat_arena.gd\",\"old\":\"        fighter.connect(\\\"attack_connected\\\", _receive_enemy_attack)\",\"new\":\"        fighter.connect(\\\"attack_connected\\\", _receive_field_enemy_attack)\"},{\"path\":\"combat/combat_arena.gd\",\"old\":\"func unregister_field_enemy(fighter: CharacterBody3D) -> void:\",\"new\":\"func _receive_field_enemy_attack(amount: int) -> void:\\n    var mission: Node = get_tree().get_first_node_in_group(\\\"field_mission_v048\\\")\\n    if is_instance_valid(mission) and mission.has_method(\\\"intercept_field_attack\\\"):\\n        if bool(mission.call(\\\"intercept_field_attack\\\", amount)):\\n            _announce(\\\"Your volunteer partner intercepted an attack.\\\", 1.6)\\n            return\\n    _receive_enemy_attack(amount)\\n\\nfunc unregister_field_enemy(fighter: CharacterBody3D) -> void:\"},{\"path\":\"combat/sparring_construct.gd\",\"old\":\"var patrol_min_x: float = -9.8\",\"new\":\"var adaptive_field: bool = false\\nvar rapid_hits: int = 0\\nvar last_hit_ms: int = -10000\\nvar patrol_min_x: float = -9.8\"},{\"path\":\"combat/sparring_construct.gd\",\"old\":\"func set_patrol_bounds(horizontal: Vector2, longitudinal: Vector2) -> void:\\n    patrol_min_x\",\"new\":\"func set_patrol_bounds(horizontal: Vector2, longitudinal: Vector2) -> void:\\n    adaptive_field = true\\n    patrol_min_x\"},{\"path\":\"combat/sparring_construct.gd\",\"old\":\"    health = maxi(0, health - actual_damage)\\n    if is_instance_valid(visual_rig):\",\"new\":\"    health = maxi(0, health - actual_damage)\\n    if adaptive_field:\\n        var now_ms: int = Time.get_ticks_msec()\\n        rapid_hits = rapid_hits + 1 if now_ms - last_hit_ms < 1400 else 1\\n        last_hit_ms = now_ms\\n    if is_instance_valid(visual_rig):\"},{\"path\":\"combat/sparring_construct.gd\",\"old\":\"    else:\\n        state = \\\"stagger\\\"\\n        state_timer = 0.20 if blocked else 0.38\\n        var push: Vector3 = global_position - attacker_position\",\"new\":\"    else:\\n        if adaptive_field and rapid_hits >= 2 and guard_cooldown <= 0.0:\\n            state = \\\"guard\\\"\\n            state_timer = 0.86\\n            guard_cooldown = 3.6\\n            rapid_hits = 0\\n        else:\\n            state = \\\"stagger\\\"\\n            state_timer = 0.20 if blocked else 0.38\\n        var push: Vector3 = global_position - attacker_position\"},{\"path\":\"combat/sparring_construct.gd\",\"old\":\"func reset_construct() -> void:\\n    health = MAX_HEALTH\",\"new\":\"func reset_construct() -> void:\\n    rapid_hits = 0\\n    last_hit_ms = -10000\\n    health = MAX_HEALTH\"},{\"path\":\"systems/personal_codex.gd\",\"old\":\"    output += \\\"\\\\nLIFE CHRONICLE  (%d saved events)\\\\n\\\" % entries.size()\",\"new\":\"    var companion: Dictionary = profile.get(\\\"companion_v049\\\", {})\\n    if not companion.is_empty():\\n        output += \\\"\\\\nFIELD COMPANION / GAME-ONLY\\\\n\\\"\\n        output += \\\"Trust: %d | Injury: %d/100 | Interceptions: %d\\\\n\\\" % [\\n            int(companion.get(\\\"loyalty\\\", 0)), int(companion.get(\\\"injury\\\", 0)), int(companion.get(\\\"interventions\\\", 0))]\\n        output += \\\"Last field outcome: %s\\\\n\\\" % str(companion.get(\\\"outcome\\\", \\\"unresolved\\\"))\\n    output += \\\"\\\\nLIFE CHRONICLE  (%d saved events)\\\\n\\\" % entries.size()\"}]")
          for path, contents in generated.items():
              dest=Path(path)
              if dest.exists():
                  if dest.read_text()!=contents: raise SystemExit('New-file conflict: '+path)
                  continue
              dest.parent.mkdir(parents=True,exist_ok=True)
              dest.write_text(contents)
          for patch in patches:
              dest=Path(patch['path'])
              value=dest.read_text()
              old=patch['old']
              new=patch['new']
              if value.count(old)!=1: raise SystemExit('Patch anchor mismatch: '+str(dest))
              dest.write_text(value.replace(old,new))
          assert 'intercept_field_attack' in Path('systems/field_mission_v048.gd').read_text()
          assert 'seeker_profile_v1.json' in Path('systems/personal_codex.gd').read_text()
          assert 'joystick_finger' in Path('ui/mobile_controls.gd').read_text()
          assert 'field_mission_v048' in Path('scenes/main.tscn').read_text()
          print('V0.49 guarded source patch installed in CI workspace')
          PYINSTALL
      - name: Install Godot 4.4.1 with Web templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true
      - name: Validate whole-game import and startup
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s godot --headless --path . --editor --import --quit 2>&1 | tee v049-import.log
          if grep -E 'ERROR:|SCRIPT ERROR:|Parse Error' v049-import.log; then exit 1; fi
          timeout 80s godot --headless --path . --quit-after 150 2>&1 | tee v049-startup.log
          if grep -E 'ERROR:|SCRIPT ERROR:|Parse Error' v049-startup.log; then exit 1; fi
      - name: Test social memory, training, field mission and companion persistence
        shell: bash
        run: |
          set -euo pipefail
          for spec in 'v044_relationship:V0.44 SOCIAL MEMORY SMOKE PASS' 'v046_muti:V0.46 SEVEN SPOKES SAFETY SMOKE PASS' 'v048_field:V0.48 FIELD MISSION STATE SMOKE PASS' 'v049_companion:V0.49 COMPANION STATE SMOKE PASS'; do
            testname="${spec%%:*}"
            expected="${spec#*:}"
            timeout 45s godot --headless --path . "res://tests/${testname}_scene.tscn" --quit-after 220 2>&1 | tee "${testname}.log"
            if grep -E 'ERROR:|SCRIPT ERROR:|Parse Error' "${testname}.log"; then exit 1; fi
            grep -Fq "${expected}" "${testname}.log" || { echo "Missing test success marker for ${testname}"; exit 1; }
          done
      - name: Export development Web build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/web
          timeout 120s godot --headless --path . --export-release Web build/web/index.html 2>&1 | tee v049-export.log
          if grep -E 'ERROR:|SCRIPT ERROR:|Parse Error' v049-export.log; then exit 1; fi
          for ext in html js wasm pck; do test -s "build/web/index.${ext}"; done
      - name: Commit only validated source to development branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add systems/companion_state_v049.gd systems/field_mission_v048.gd combat/combat_arena.gd combat/sparring_construct.gd systems/personal_codex.gd tests/v049_companion_scene.tscn tests/v049_companion_smoke.gd docs/V049_FEATURES.md
          if ! git diff --cached --quiet; then
            git commit -m 'V0.49 companion injuries loyalty daily recovery and adaptive field guard'
            git pull --rebase origin codex-modular-v31
            git push origin HEAD:codex-modular-v31
          fi
      - name: Retain internal Web artifact for eventual release
        uses: actions/upload-artifact@v4
        with:
          name: seeker-codex-v049-dev-web
          path: build/web/
          if-no-files-found: error
      - name: Diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: margerina-v049-diagnostics
          if-no-files-found: ignore
          path: |
            v049-import.log
            v049-startup.log
            v049-export.log
            v044_relationship.log
            v046_muti.log
            v048_field.log
            v049_companion.log
