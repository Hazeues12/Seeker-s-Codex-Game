      - name: Install Godot 4.4.1 and HTML5 templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true
      - name: Import and validate complete game startup
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s godot --headless --path . --editor --import --quit 2>&1 | tee v050-import.log
          if grep -E 'ERROR:|SCRIPT ERROR:|Parse Error' v050-import.log; then exit 1; fi
          timeout 80s godot --headless --path . --quit-after 180 2>&1 | tee v050-startup.log
          if grep -E 'ERROR:|SCRIPT ERROR:|Parse Error' v050-startup.log; then exit 1; fi
      - name: Field mission and overnight state regression
        shell: bash
        run: |
          set -euo pipefail
          for spec in 'v048_field:V0.48 FIELD MISSION STATE SMOKE PASS' 'v049_companion:V0.49 COMPANION STATE SMOKE PASS' 'v050_expedition:V0.50 MULTI-DAY EXPEDITION SMOKE PASS'; do
            testname="${spec%%:*}"
            expected="${spec#*:}"
            timeout 45s godot --headless --path . "res://tests/${testname}_scene.tscn" --quit-after 240 2>&1 | tee "${testname}.log"
            if grep -E 'ERROR:|SCRIPT ERROR:|Parse Error' "${testname}.log"; then exit 1; fi
            grep -Fq "$expected" "${testname}.log" || exit 1
          done
      - name: Export complete development Web build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/web
          timeout 120s godot --headless --path . --export-release Web build/web/index.html 2>&1 | tee v050-export.log
          if grep -E 'ERROR:|SCRIPT ERROR:|Parse Error' v050-export.log; then exit 1; fi
          for ext in html js wasm pck; do test -s "build/web/index.${ext}"; done
      - name: Commit gameplay after all checks pass
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scenes/main.tscn systems/hub_manager.gd characters/player_controller.gd systems/personal_codex.gd systems/expedition_rules_v050.gd world/multi_day_expedition_v050.gd tests/v050_expedition_scene.tscn tests/v050_expedition_smoke.gd docs/V050_FEATURES.md
          if ! git diff --cached --quiet; then
            git commit -m 'V0.50 multi-day carriage route and overnight mission'
            git pull --rebase origin codex-modular-v31
            git push origin HEAD:codex-modular-v31
          fi
      - name: Retain internal Web build
        uses: actions/upload-artifact@v4
        with:
          name: seeker-codex-v050-dev-web
          path: build/web/
          if-no-files-found: error
      - name: Save diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: margerina-v050-diagnostics
          if-no-files-found: ignore
          path: |
            v050-import.log
            v050-startup.log
            v050-export.log
            v048_field.log
            v049_companion.log
            v050_expedition.log
