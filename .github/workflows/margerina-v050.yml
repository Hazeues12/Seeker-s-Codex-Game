          new_old = 'if (key.begins_with("npc_") or key.begins_with("exp_v050_")) and (not is_instance_valid(spot_node) or not spot_node.visible):'
          new_final = 'if (key.begins_with("npc_") or key.begins_with("field_v048_") or key.begins_with("exp_v050_")) and (not is_instance_valid(spot_node) or not spot_node.visible):'
