                      raise SystemExit(f'Conflicting file: {path}')
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_bytes(data)
          PYCODE
          python3 -m py_compile install_v046.py
          python3 install_v046.py
          rm install_v046.py
          grep -q 'SevenSpokesTraining' scenes/main.tscn
          grep -q 'training_spoke_effect' combat/combat_arena.gd
          grep -q 'apply_psychic_disruption' combat/sparring_construct.gd
          grep -q 'joystick_finger' ui/mobile_controls.gd
          grep -q 'wall_running' characters/player_controller.gd
          grep -q 'seeker_profile_v1.json' systems/personal_codex.gd

      - name: Install Godot 4.4.1 with Web templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Verify complete game script imports and startup
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s godot --headless --path . --editor --import --quit 2>&1 | tee v046-import.log
          if grep -E 'ERROR:|SCRIPT ERROR:|Parse Error' v046-import.log; then exit 1; fi
          timeout 80s godot --headless --path . --quit-after 180 2>&1 | tee v046-startup.log
          if grep -E 'ERROR:|SCRIPT ERROR:|Parse Error' v046-startup.log; then exit 1; fi

      - name: Confirm V0.44 saved relationship regression
        shell: bash
        run: |
          set -euo pipefail
          timeout 40s godot --headless --path . res://tests/v044_relationship_scene.tscn --quit-after 220 2>&1 | tee v046-relations.log
          if grep -E 'ERROR:|SCRIPT ERROR:|Parse Error' v046-relations.log; then exit 1; fi
          grep -q 'V0.44 SOCIAL MEMORY SMOKE PASS' v046-relations.log

      - name: Confirm V0.46 cost cooldown and sandbox restrictions
        shell: bash
        run: |
          set -euo pipefail
          timeout 40s godot --headless --path . res://tests/v046_muti_scene.tscn --quit-after 220 2>&1 | tee v046-spokes.log
          if grep -E 'ERROR:|SCRIPT ERROR:|Parse Error' v046-spokes.log; then exit 1; fi
          grep -q 'V0.46 SEVEN SPOKES SAFETY SMOKE PASS' v046-spokes.log

      - name: Export development Web build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/web
          timeout 120s godot --headless --path . --export-release Web build/web/index.html 2>&1 | tee v046-export.log
          if grep -E 'ERROR:|SCRIPT ERROR:|Parse Error' v046-export.log; then exit 1; fi
          for ext in html js wasm pck; do
            test -s "build/web/index.$ext" || { echo "Missing Web output: $ext"; exit 1; }
          done

      - name: Commit V0.46 only after validation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scenes/main.tscn combat/combat_arena.gd combat/sparring_construct.gd systems/seven_spokes_training.gd tests/v046_muti_smoke.gd tests/v046_muti_scene.tscn docs/V046_FEATURES.md
          if ! git diff --cached --quiet; then
            git commit -m 'V0.46 introduce supervised Seven Spokes combat mechanics'
            git pull --rebase origin codex-modular-v31
            git push origin HEAD:codex-modular-v31
          else
            echo 'V0.46 installed; no gameplay delta'
          fi

      - name: Archive private development Web build
        uses: actions/upload-artifact@v4
        with:
          name: seeker-codex-v046-dev-web
          path: build/web/
          if-no-files-found: error

      - name: Keep diagnostic logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: margerina-v046-diagnostics
          if-no-files-found: ignore
          path: |
            v046-import.log
            v046-startup.log
            v046-relations.log
            v046-spokes.log
            v046-export.log