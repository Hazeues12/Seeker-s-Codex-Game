          grep -q 'joystick_finger' ui/mobile_controls.gd
          grep -q 'wall_running' characters/player_controller.gd
          grep -q 'margerina_v033.json' systems/hub_manager.gd

      - name: Install Godot 4.4.1 and browser export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Validate source import and 120 frame startup
        shell: bash
        run: |
          set -euo pipefail
          godot --version
          godot --headless --path . --editor --import --quit 2>&1 | tee v040-import.log
          if grep -E 'ERROR:|SCRIPT ERROR:|Parse Error' v040-import.log; then exit 1; fi
          godot --headless --path . --quit-after 120 2>&1 | tee v040-startup.log
          if grep -E 'ERROR:|SCRIPT ERROR:|Parse Error' v040-startup.log; then exit 1; fi

      - name: Export V0.40 browser game
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/web
          godot --headless --path . --export-release Web build/web/index.html 2>&1 | tee v040-export.log
          if grep -E 'ERROR:|SCRIPT ERROR:|Parse Error' v040-export.log; then exit 1; fi
          for ext in html js wasm pck; do
            test -s "build/web/index.$ext" || { echo "Missing build/web/index.$ext"; exit 1; }
          done
          ls -lh build/web/

      - name: Commit validated gameplay changes to development branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add systems/hub_manager.gd scenes/main.tscn world/magnara_ring_two.gd docs/MAGNARA_CANON_BLUEPRINT.md
          if ! git diff --cached --quiet; then
            git commit -m 'V0.40 establish canon-aware Ring Two city bands and modular streaming'
            git pull --rebase origin codex-modular-v31
            git push origin HEAD:codex-modular-v31
          else
            echo 'V0.40 already installed; nothing new to commit'
          fi

      - name: Upload V0.40 browser ZIP for itch.io
        uses: actions/upload-artifact@v4
        with:
          name: seeker-codex-v040-web
          path: build/web/
          if-no-files-found: error

      - name: Keep failure logs for debugging
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: margerina-v040-debug-logs
          if-no-files-found: ignore
          path: |
            v040-import.log
            v040-startup.log
            v040-export.log
