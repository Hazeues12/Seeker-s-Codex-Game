              if {entry.name for entry in members} != allowed or any(not entry.isfile() for entry in members):
                  raise SystemExit('Unexpected V0.43 payload members')
              for entry in members:
                  destination = Path(entry.name)
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  handle = bundle.extractfile(entry)
                  if handle is None:
                      raise SystemExit('Could not read V0.43 package member')
                  content = handle.read()
