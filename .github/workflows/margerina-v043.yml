          grep -q 'var joystick_finger: int' ui/mobile_controls.gd
          grep -q 'wall_running' characters/player_controller.gd
          grep -q 'margerina_v033.json' systems/hub_manager.gd

      - name: Install Godot 4.4.1 with HTML5 templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Validate full game import and startup
        shell: bash
        run: |
          set -euo pipefail
          godot --version
          godot --headless --path . --editor --import --quit 2>&1 | tee v043-import.log
          if grep -E 'ERROR:|SCRIPT ERROR:|Parse Error' v043-import.log; then exit 1; fi
          godot --headless --path . --quit-after 150 2>&1 | tee v043-startup.log
          if grep -E 'ERROR:|SCRIPT ERROR:|Parse Error' v043-startup.log; then exit 1; fi

      - name: Test Codex event deduplication and save reload
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/v043_codex_smoke.gd 2>&1 | tee v043-smoke.log
          if grep -E 'ERROR:|SCRIPT ERROR:|Parse Error' v043-smoke.log; then exit 1; fi
          grep -q 'Codex persistence, event deduplication and reload passed' v043-smoke.log

      - name: Export and validate browser game
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/web
          godot --headless --path . --export-release Web build/web/index.html 2>&1 | tee v043-export.log
          if grep -E 'ERROR:|SCRIPT ERROR:|Parse Error' v043-export.log; then exit 1; fi
          for ext in html js wasm pck; do
            test -s "build/web/index.$ext" || { echo "Missing build/web/index.$ext"; exit 1; }
          done
          ls -lh build/web/

      - name: Commit validated V0.43 only to development branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scenes/main.tscn systems/hub_manager.gd characters/player_controller.gd \
            systems/personal_codex.gd docs/V043_FEATURES.md \
            docs/MARGERINA_MASTER_RPG_DESIGN_BIBLE.md tests/v043_codex_smoke.gd
          if ! git diff --cached --quiet; then
            git commit -m 'V0.43 add persistent Personal Codex and world history'
            git pull --rebase origin codex-modular-v31
            git push origin HEAD:codex-modular-v31
          else
            echo 'V0.43 already installed; no changes'
          fi

      - name: Upload playable browser files
        uses: actions/upload-artifact@v4
        with:
          name: seeker-codex-v043-web
          path: build/web/
          if-no-files-found: error

      - name: Save diagnostic logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: margerina-v043-debug-logs
          if-no-files-found: ignore
          path: |
            v043-import.log
            v043-startup.log
            v043-smoke.log
            v043-export.log