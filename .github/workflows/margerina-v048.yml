          grep -q 'joystick_finger' ui/mobile_controls.gd
          grep -q 'wall_running' characters/player_controller.gd

      - name: Setup Godot 4.4.1 with Web export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Import and run full game for 180 frames
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s godot --headless --path . --editor --import --quit 2>&1 | tee v048-import.log
          if grep -E 'ERROR:|SCRIPT ERROR:|Parse Error' v048-import.log; then exit 1; fi
          timeout 90s godot --headless --path . --quit-after 180 2>&1 | tee v048-startup.log
          if grep -E 'ERROR:|SCRIPT ERROR:|Parse Error' v048-startup.log; then exit 1; fi

      - name: Preserve V0.44 relationship save checks
        shell: bash
        run: |
          set -euo pipefail
          timeout 45s godot --headless --path . res://tests/v044_relationship_scene.tscn --quit-after 220 2>&1 | tee v048-relations.log
          if grep -E 'ERROR:|SCRIPT ERROR:|Parse Error' v048-relations.log; then exit 1; fi
          grep -q 'V0.44 SOCIAL MEMORY SMOKE PASS' v048-relations.log

      - name: Preserve V0.46 Muti rules checks
        shell: bash
        run: |
          set -euo pipefail
          timeout 45s godot --headless --path . res://tests/v046_muti_scene.tscn --quit-after 220 2>&1 | tee v048-spokes.log
          if grep -E 'ERROR:|SCRIPT ERROR:|Parse Error' v048-spokes.log; then exit 1; fi
          grep -q 'V0.46 SEVEN SPOKES SAFETY SMOKE PASS' v048-spokes.log

      - name: Verify V0.48 exclusive choices and mission state reload
        shell: bash
        run: |
          set -euo pipefail
          timeout 45s godot --headless --path . res://tests/v048_field_scene.tscn --quit-after 220 2>&1 | tee v048-field.log
          if grep -E 'ERROR:|SCRIPT ERROR:|Parse Error' v048-field.log; then exit 1; fi
          grep -q 'V0.48 FIELD MISSION STATE SMOKE PASS' v048-field.log

      - name: Verify complete Web export
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/web
          timeout 130s godot --headless --path . --export-release Web build/web/index.html 2>&1 | tee v048-export.log
          if grep -E 'ERROR:|SCRIPT ERROR:|Parse Error' v048-export.log; then exit 1; fi
          for ext in html js wasm pck; do test -s "build/web/index.$ext" || exit 1; done

      - name: Commit only validated development source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scenes/main.tscn systems/hub_manager.gd characters/player_controller.gd systems/personal_codex.gd systems/field_rules_v048.gd systems/field_mission_v048.gd combat/combat_arena.gd combat/sparring_construct.gd tests/v048_field_smoke.gd tests/v048_field_scene.tscn docs/V048_FEATURES.md
          if ! git diff --cached --quiet; then
            git commit -m 'V0.48 add companion field watch and persistent mission choices'
            git pull --rebase origin codex-modular-v31
            git push origin HEAD:codex-modular-v31
          fi

      - name: Archive development Web build only
        uses: actions/upload-artifact@v4
        with:
          name: seeker-codex-v048-dev-web
          path: build/web/
          if-no-files-found: error

      - name: Archive validation logs if checks fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: margerina-v048-debug-logs
          if-no-files-found: ignore
          path: |
            v048-import.log
            v048-startup.log
            v048-relations.log
            v048-spokes.log
            v048-field.log
            v048-export.log