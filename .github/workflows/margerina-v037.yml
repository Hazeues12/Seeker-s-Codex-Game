          grep -q 'VisualDistrict' scenes/main.tscn

      - name: Install Godot 4.4.1 and browser templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Validate Godot import and 120-frame startup
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --editor --import --quit 2>&1 | tee v037-import.log
          if grep -E 'ERROR:|SCRIPT ERROR:|Parse Error' v037-import.log; then exit 1; fi
          godot --headless --path . --quit-after 120 2>&1 | tee v037-startup.log
          if grep -E 'ERROR:|SCRIPT ERROR:|Parse Error' v037-startup.log; then exit 1; fi

      - name: Export iPhone friendly browser build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/web
          godot --headless --path . --export-release Web build/web/index.html 2>&1 | tee v037-export.log
          if grep -E 'ERROR:|SCRIPT ERROR:|Parse Error' v037-export.log; then exit 1; fi
          for ext in html js wasm pck; do
            test -s "build/web/index.$ext" || { echo "Missing Web index.$ext"; exit 1; }
          done
          ls -lh build/web/

      - name: Commit V0.37 only after successful tests
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add characters/procedural_seeker.gd world/visual_district.gd docs/V037_FEATURES.md characters/player_controller.gd combat/sparring_construct.gd scenes/main.tscn
          if ! git diff --cached --quiet; then
            git commit -m 'V0.37 animate Seeker models and add Magnara district dressing'
            git pull --rebase origin codex-modular-v31
            git push origin HEAD:codex-modular-v31
          else
            echo 'V0.37 already installed; no changes to commit'
          fi

      - name: Upload verified V0.37 game for itch.io
        uses: actions/upload-artifact@v4
        with:
          name: seeker-codex-v037-web
          path: build/web/
          if-no-files-found: error

      - name: Upload Godot debug logs only if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: margerina-v037-debug-logs
          if-no-files-found: ignore
          path: |
            v037-import.log
            v037-startup.log
            v037-export.log
