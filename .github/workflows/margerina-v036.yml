                     'upgrade_payload/ambient_life.gd', 'upgrade_payload/V036_FEATURES.md'}
          with tarfile.open(fileobj=io.BytesIO(data), mode='r:gz') as bundle:
              items = bundle.getmembers()
              if {item.name for item in items} != allowed or len(items) != len(allowed):
                  raise SystemExit('Invalid V0.36 bundled file list')
              for item in items:
                  if not item.isfile():
                      raise SystemExit('Unexpected non-file entry in V0.36 bundle')
                  path = pathlib.Path(item.name)
                  path.parent.mkdir(parents=True, exist_ok=True)
                  stream = bundle.extractfile(item)
                  if stream is None:
                      raise SystemExit('Missing bundle content')
                  path.write_bytes(stream.read())
