          python3 install_v036.py
          rm install_v036.py
          rm -rf upgrade_payload
          test -s combat/sparring_construct.gd
          test -s combat/combat_arena.gd
          test -s world/ambient_life.gd
          grep -q 'func _spawn_hit_sparks' combat/combat_arena.gd
          grep -q 'func take_strike' combat/sparring_construct.gd
          grep -q 'func _process' world/ambient_life.gd

      - name: Install Godot 4.4.1 with Web templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Validate Godot import and 120-frame startup
        shell: bash
        run: |
          set -euo pipefail
          godot --version
          godot --headless --path . --editor --import --quit 2>&1 | tee v036-import.log
          if grep -E 'ERROR:|SCRIPT ERROR:|Parse Error' v036-import.log; then exit 1; fi
          godot --headless --path . --quit-after 120 2>&1 | tee v036-startup.log
          if grep -E 'ERROR:|SCRIPT ERROR:|Parse Error' v036-startup.log; then exit 1; fi

      - name: Export HTML5 Web build for itch.io
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/web
          godot --headless --path . --export-release Web build/web/index.html 2>&1 | tee v036-export.log
          if grep -E 'ERROR:|SCRIPT ERROR:|Parse Error' v036-export.log; then exit 1; fi
          for ext in html js wasm pck; do
            test -s "build/web/index.$ext" || { echo "Missing Web export index.$ext"; exit 1; }
          done
          ls -lh build/web/

      - name: Commit only validated V0.36 gameplay changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add combat/sparring_construct.gd combat/combat_arena.gd world/ambient_life.gd docs/V036_FEATURES.md
          if ! git diff --cached --quiet; then
            git commit -m 'V0.36 add guard and skirmisher AI, combat FX and ambient NPCs'
            git pull --rebase origin codex-modular-v31
            git push origin HEAD:codex-modular-v31
          else
            echo 'V0.36 already installed, skipping duplicate commit'
          fi

      - name: Upload playable V0.36 Web game ZIP
        uses: actions/upload-artifact@v4
        with:
          name: seeker-codex-v036-web
          path: build/web/
          if-no-files-found: error

      - name: Upload failure logs for debugging
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: margerina-v036-error-logs
          path: |
            v036-import.log
            v036-startup.log
            v036-export.log
          if-no-files-found: ignore
