      - name: Setup Godot 4.4.1 HTML5 build tools
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Validate full game import and startup
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s godot --headless --path . --editor --import --quit 2>&1 | tee v045-import.log
          if grep -E 'ERROR:|SCRIPT ERROR:|Parse Error' v045-import.log; then exit 1; fi
          timeout 80s godot --headless --path . --quit-after 150 2>&1 | tee v045-startup.log
          if grep -E 'ERROR:|SCRIPT ERROR:|Parse Error' v045-startup.log; then exit 1; fi

      - name: V0.44 social memory regression tests
        shell: bash
        run: |
          set -euo pipefail
          timeout 40s godot --headless --path . res://tests/v044_relationship_scene.tscn --quit-after 220 2>&1 | tee v045-regression.log
          if grep -E 'ERROR:|SCRIPT ERROR:|Parse Error' v045-regression.log; then exit 1; fi
          grep -q 'V0.44 SOCIAL MEMORY SMOKE PASS' v045-regression.log

      - name: V0.45 decision, save, romance, reputation and fraud tests
        shell: bash
        run: |
          set -euo pipefail
          timeout 40s godot --headless --path . res://tests/v045_society_scene.tscn --quit-after 220 2>&1 | tee v045-society.log
          if grep -E 'ERROR:|SCRIPT ERROR:|Parse Error' v045-society.log; then exit 1; fi
          grep -q 'V0.45 SOCIETY OUTCOMES SMOKE PASS' v045-society.log

      - name: Validate and package complete Web game
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/web
          timeout 120s godot --headless --path . --export-release Web build/web/index.html 2>&1 | tee v045-export.log
          if grep -E 'ERROR:|SCRIPT ERROR:|Parse Error' v045-export.log; then exit 1; fi
          for ext in html js wasm pck; do
            test -s "build/web/index.$ext" || { echo "Missing index.$ext"; exit 1; }
          done

      - name: Commit only validated V0.45 gameplay and documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scenes/main.tscn systems/hub_manager.gd systems/personal_codex.gd systems/seeker_society.gd systems/seeker_dialogues_v045.gd tests/v045_society_smoke.gd tests/v045_society_scene.tscn docs/V045_FEATURES.md docs/RELEASE_GATES.md
          if ! git diff --cached --quiet; then
            git commit -m 'V0.45 consequential dialogue, economy, adult courtship and professional standing'
            git pull --rebase origin codex-modular-v31
            git push origin HEAD:codex-modular-v31
          fi

      - name: Archive developer-only Web build (release later)
        uses: actions/upload-artifact@v4
        with:
          name: seeker-codex-v045-dev-web
          path: build/web/
          if-no-files-found: error

      - name: Archive diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: margerina-v045-diagnostics
          if-no-files-found: ignore
