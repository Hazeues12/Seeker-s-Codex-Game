          grep -q 'func apply_player_appearance(' characters/procedural_seeker.gd
          grep -q 'func spend_guard_stamina()' systems/hub_manager.gd
          grep -q 'SeekerCreator' scenes/main.tscn
          grep -q 'QuarterLife' scenes/main.tscn
          grep -q 'GuardButton' ui/mobile_controls.tscn

      - name: Install Godot 4.4.1 and Web templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Validate Godot import and 140-frame startup
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --editor --import --quit 2>&1 | tee v038-import.log
          if grep -E 'ERROR:|SCRIPT ERROR:|Parse Error' v038-import.log; then exit 1; fi
          godot --headless --path . --quit-after 140 2>&1 | tee v038-startup.log
          if grep -E 'ERROR:|SCRIPT ERROR:|Parse Error' v038-startup.log; then exit 1; fi

      - name: Export V0.38 iPhone browser game
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/web
          godot --headless --path . --export-release Web build/web/index.html 2>&1 | tee v038-export.log
          if grep -E 'ERROR:|SCRIPT ERROR:|Parse Error' v038-export.log; then exit 1; fi
          for ext in html js wasm pck; do
            test -s "build/web/index.$ext" || { echo "Missing Web index.$ext"; exit 1; }
          done
          ls -lh build/web/

      - name: Commit tested V0.38 only to development branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add characters/procedural_seeker.gd characters/player_controller.gd combat/combat_arena.gd systems/hub_manager.gd ui/mobile_controls.gd ui/mobile_controls.tscn ui/seeker_creator.gd world/quarter_life.gd scenes/main.tscn docs/V038_FEATURES.md
          if ! git diff --cached --quiet; then
            git commit -m 'V0.38 add Seeker appearance editor, guard and interactive market'
            git pull --rebase origin codex-modular-v31
            git push origin HEAD:codex-modular-v31
          else
            echo 'V0.38 already present; no gameplay edits needed'
          fi

      - name: Upload playable V0.38 Web game for itch.io
        uses: actions/upload-artifact@v4
        with:
          name: seeker-codex-v038-web
          path: build/web/
          if-no-files-found: error

      - name: Upload diagnostic logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: margerina-v038-debug-logs
          path: |
            v038-import.log
            v038-startup.log
            v038-export.log
          if-no-files-found: ignore
