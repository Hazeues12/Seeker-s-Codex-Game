          with tarfile.open(fileobj=io.BytesIO(base64.b64decode(payload)), mode='r:gz') as archive:
              members = archive.getmembers()
              if len(members) != len(permitted) or {entry.name for entry in members} != permitted:
                  raise SystemExit('Invalid V0.38 source manifest')
              for entry in members:
                  if not entry.isfile():
                      raise SystemExit('Unexpected archive entry')
                  path = pathlib.Path(entry.name)
                  path.parent.mkdir(parents=True, exist_ok=True)
                  stream = archive.extractfile(entry)
                  if stream is None:
                      raise SystemExit(f'Missing source file {entry.name}')
                  contents = stream.read().decode('utf-8')
                  if path.exists() and path.read_text() != contents:
                      raise SystemExit(f'Conflicting V0.38 file: {path}')
                  path.write_text(contents)
