          grep -q 'wall_running' characters/player_controller.gd
          grep -q 'res://world/traversal_course.gd' scenes/main.tscn
          test -s docs/V039_FEATURES.md

      - name: Install Godot 4.4.1 and HTML5 templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Validate import and 120-frame startup
        shell: bash
        run: |
          set -euo pipefail
          godot --version
          godot --headless --path . --editor --import --quit 2>&1 | tee v039-import.log
          if grep -E 'ERROR:|SCRIPT ERROR:|Parse Error' v039-import.log; then exit 1; fi
          godot --headless --path . --quit-after 120 2>&1 | tee v039-startup.log
          if grep -E 'ERROR:|SCRIPT ERROR:|Parse Error' v039-startup.log; then exit 1; fi

      - name: Export Godot Web game for itch.io
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/web
          godot --headless --path . --export-release Web build/web/index.html 2>&1 | tee v039-export.log
          if grep -E 'ERROR:|SCRIPT ERROR:|Parse Error' v039-export.log; then exit 1; fi
          for ext in html js wasm pck; do
            test -s "build/web/index.$ext" || { echo "Missing index.$ext"; exit 1; }
          done
          ls -lh build/web/

      - name: Commit validated parkour source to development branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add characters/player_controller.gd ui/mobile_controls.gd scenes/main.tscn world/traversal_course.gd docs/V039_FEATURES.md
          if ! git diff --cached --quiet; then
            git commit -m 'V0.39 enable simultaneous touch controls and traversal parkour'
            git pull --rebase origin codex-modular-v31
            git push origin HEAD:codex-modular-v31
          else
            echo 'V0.39 already installed; no new gameplay files'
          fi

      - name: Upload V0.39 playable Web files
        uses: actions/upload-artifact@v4
        with:
          name: seeker-codex-v039-web
          path: build/web/
          if-no-files-found: error

      - name: Save logs if validation fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: margerina-v039-debug-logs
          if-no-files-found: ignore
          path: |
            v039-import.log
            v039-startup.log
            v039-export.log
