name: Margerina V0.52 World First - Magnara Geometry Validation
on:
  push:
    branches: [magnara-world-v052-staging]
    paths:
      - '.github/workflows/margerina-v052-world.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-magnara-world:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - name: Checkout exact world-first staging branch
        uses: actions/checkout@v4
        with:
          ref: magnara-world-v052-staging
      - name: Verify canon atlas and existing saves
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool data/magnara_atlas_v052.json >/dev/null
          grep -q 'res://world/magnara_city_v052.gd' scenes/main.tscn
          grep -q 'EnterablePublicRestHouse' tests/v052_city_smoke.gd
          grep -q 'margerina_v033.json' systems/hub_manager.gd
          grep -q 'joystick_finger' ui/mobile_controls.gd
          grep -q 'wall_running' characters/player_controller.gd
          grep -q 'seeker_profile_v1.json' systems/personal_codex.gd
          test -s docs/MAGNARA_CANON_BLUEPRINT.md
          test -s docs/V052_MAGNARA_WORLD_FIRST.md
      - name: Set up Godot 4.4.1 with HTML5 export tools
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true
      - name: Validate complete Godot import and startup
        shell: bash
        run: |
          set -euo pipefail
          timeout 130s godot --headless --path . --editor --import --quit 2>&1 | tee v052-import.log
          if grep -E 'ERROR:|SCRIPT ERROR:|Parse Error' v052-import.log; then exit 1; fi
          timeout 85s godot --headless --path . --quit-after 160 2>&1 | tee v052-startup.log
          if grep -E 'ERROR:|SCRIPT ERROR:|Parse Error' v052-startup.log; then exit 1; fi
      - name: Test previous field, companion, expedition and resident systems
        shell: bash
        run: |
          set -euo pipefail
          for spec in 'v048_field:V0.48 FIELD MISSION STATE SMOKE PASS' 'v049_companion:V0.49 COMPANION STATE SMOKE PASS' 'v050_expedition:V0.50 MULTI-DAY EXPEDITION SMOKE PASS' 'v051_city:V0.51 DAILY CITY MEMORY SMOKE PASS'; do
            t="${spec%%:*}"
            expected="${spec#*:}"
            timeout 48s godot --headless --path . "res://tests/${t}_scene.tscn" --quit-after 220 2>&1 | tee "${t}.log"
            if grep -E 'ERROR:|SCRIPT ERROR:|Parse Error' "${t}.log"; then exit 1; fi
            grep -Fq "${expected}" "${t}.log"
          done
      - name: Verify streamed city, enterable room collision and culling
        shell: bash
        run: |
          set -euo pipefail
          timeout 65s godot --headless --path . res://tests/v052_city_scene.tscn --quit-after 250 2>&1 | tee v052-city.log
          if grep -E 'ERROR:|SCRIPT ERROR:|Parse Error' v052-city.log; then exit 1; fi
          grep -Fq 'V0.52 MAGNARA CITY GEOMETRY AND INTERIORS PASS' v052-city.log
      - name: Export full development Web build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/web
          timeout 140s godot --headless --path . --export-release Web build/web/index.html 2>&1 | tee v052-export.log
          if grep -E 'ERROR:|SCRIPT ERROR:|Parse Error' v052-export.log; then exit 1; fi
          for ext in html js wasm pck; do test -s "build/web/index.${ext}"; done
      - name: Store internal development artifact only
        uses: actions/upload-artifact@v4
        with:
          name: seeker-codex-magnara-v052-internal
          path: build/web/
          if-no-files-found: error
      - name: Save diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: margerina-v052-world-diagnostics
          if-no-files-found: ignore
          path: |
            v052-import.log
            v052-startup.log
            v052-city.log
            v052-export.log
            v048_field.log
            v049_companion.log
            v050_expedition.log
            v051_city.log
