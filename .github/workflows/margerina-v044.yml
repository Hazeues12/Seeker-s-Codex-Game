name: Margerina V0.44 Living NPC Relationships

on:
  push:
    branches: [codex-modular-v31]
    paths:
      - '.github/workflows/margerina-v044.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-relationships:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out game development branch
        uses: actions/checkout@v4
        with:
          ref: codex-modular-v31
          persist-credentials: true

      - name: Install V0.43 foundation if needed and V0.44 NPC memories
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile install_v044.py
          python3 install_v044.py
          grep -q 'SeekerRelationships' scenes/main.tscn
          grep -q 'remember_social_choice' systems/personal_codex.gd
          grep -q 'margerina_v033.json' systems/hub_manager.gd
          grep -q 'joystick_finger' ui/mobile_controls.gd
          grep -q 'wall_running' characters/player_controller.gd
          test -s docs/MARGERINA_MASTER_RPG_DESIGN_BIBLE.md

      - name: Install Godot 4.4.1 and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Validate complete game import and startup
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s godot --headless --path . --editor --import --quit 2>&1 | tee v044-import.log
          if grep -E 'ERROR:|SCRIPT ERROR:|Parse Error' v044-import.log; then exit 1; fi
          timeout 80s godot --headless --path . --quit-after 150 2>&1 | tee v044-startup.log
          if grep -E 'ERROR:|SCRIPT ERROR:|Parse Error' v044-startup.log; then exit 1; fi

      - name: Test NPC relationship save and duplicate-choice safety
        shell: bash
        run: |
          set -euo pipefail
          timeout 40s godot --headless --path . res://tests/v044_relationship_scene.tscn --quit-after 200 2>&1 | tee v044-test.log
          if grep -E 'ERROR:|SCRIPT ERROR:|Parse Error' v044-test.log; then exit 1; fi
          grep -q 'V0.44 SOCIAL MEMORY SMOKE PASS' v044-test.log

      - name: Export full playable Web build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/web
          timeout 120s godot --headless --path . --export-release Web build/web/index.html 2>&1 | tee v044-export.log
          if grep -E 'ERROR:|SCRIPT ERROR:|Parse Error' v044-export.log; then exit 1; fi
          for ext in html js wasm pck; do
            test -s "build/web/index.$ext" || { echo "Missing index.$ext"; exit 1; }
          done

      - name: Commit gameplay files only after all validation succeeds
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scenes/main.tscn systems/hub_manager.gd characters/player_controller.gd systems/personal_codex.gd systems/seeker_relationships.gd docs/MARGERINA_MASTER_RPG_DESIGN_BIBLE.md docs/V043_FEATURES.md tests/v043_codex_smoke.gd tests/v044_relationship_smoke.gd tests/v044_relationship_scene.tscn
          if ! git diff --cached --quiet; then
            git commit -m 'V0.44 install Personal Codex and persistent NPC memories'
            git pull --rebase origin codex-modular-v31
            git push origin HEAD:codex-modular-v31
          fi

      - name: Publish browser game artifact
        uses: actions/upload-artifact@v4
        with:
          name: seeker-codex-v044-web
          path: build/web/
          if-no-files-found: error

      - name: Save validation logs if a check fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: margerina-v044-diagnostics
          if-no-files-found: ignore
          path: |
            v044-import.log
            v044-startup.log
            v044-test.log
            v044-export.log
