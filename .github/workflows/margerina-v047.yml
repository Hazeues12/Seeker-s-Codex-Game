      - name: Install Godot 4.4.1 and Web export tools
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Validate whole game import and startup
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s godot --headless --path . --editor --import --quit 2>&1 | tee v047-import.log
          if grep -E 'ERROR:|SCRIPT ERROR:|Parse Error' v047-import.log; then exit 1; fi
          timeout 80s godot --headless --path . --quit-after 180 2>&1 | tee v047-startup.log
          if grep -E 'ERROR:|SCRIPT ERROR:|Parse Error' v047-startup.log; then exit 1; fi

      - name: Guard Seven Spokes combat rules regression
        shell: bash
        run: |
          set -euo pipefail
          timeout 40s godot --headless --path . res://tests/v046_muti_scene.tscn --quit-after 220 2>&1 | tee v047-spokes.log
          if grep -E 'ERROR:|SCRIPT ERROR:|Parse Error' v047-spokes.log; then exit 1; fi
          grep -q 'V0.46 SEVEN SPOKES SAFETY SMOKE PASS' v047-spokes.log

      - name: Test exclusive civic incident decisions and consequences
        shell: bash
        run: |
          set -euo pipefail
          timeout 40s godot --headless --path . res://tests/v047_incident_scene.tscn --quit-after 220 2>&1 | tee v047-incident.log
          if grep -E 'ERROR:|SCRIPT ERROR:|Parse Error' v047-incident.log; then exit 1; fi
          grep -q 'V0.47 CIVIC CONSEQUENCES SMOKE PASS' v047-incident.log

      - name: Validate full Web export
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/web
          timeout 120s godot --headless --path . --export-release Web build/web/index.html 2>&1 | tee v047-export.log
          if grep -E 'ERROR:|SCRIPT ERROR:|Parse Error' v047-export.log; then exit 1; fi
          for ext in html js wasm pck; do test -s "build/web/index.$ext"; done

      - name: Commit only tested V0.47 gameplay
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scenes/main.tscn systems/hub_manager.gd characters/player_controller.gd systems/seeker_society.gd world/canal_incident.gd tests/v047_incident_smoke.gd tests/v047_incident_scene.tscn docs/V047_FEATURES.md
          if ! git diff --cached --quiet; then
            git commit -m 'V0.47 add persistent public canal incident with exclusive choices'
            git pull --rebase origin codex-modular-v31
            git push origin HEAD:codex-modular-v31
          fi

      - name: Archive developer Web build for final release candidate
        uses: actions/upload-artifact@v4
        with:
          name: seeker-codex-v047-dev-web
          path: build/web/
          if-no-files-found: error

      - name: Save diagnostic logs on test failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: margerina-v047-diagnostics
          if-no-files-found: ignore
          path: |
            v047-import.log
            v047-startup.log
            v047-spokes.log
            v047-incident.log
            v047-export.log