          with tarfile.open(fileobj=io.BytesIO(base64.b64decode(payload)), mode='r:gz') as archive:
              members = archive.getmembers()
              if {m.name for m in members} != allowed or any(not m.isfile() for m in members):
                  raise SystemExit('V0.41 installer package differs from expected files')
              for member in members:
                  target = Path(member.name)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  resource = archive.extractfile(member)
                  if resource is None:
                      raise SystemExit('Missing V0.41 file')
                  data = resource.read()
                  if target.exists() and target.read_bytes() != data:
                      raise SystemExit(f'Conflicting existing file: {target}')
                  target.write_bytes(data)
