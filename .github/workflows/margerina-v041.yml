          rm install_v041.py
          grep -q 'ring_two_life' systems/hub_manager.gd
          grep -q 'RingTwoDailyLife' scenes/main.tscn
          grep -q 'joystick_finger' ui/mobile_controls.gd
          grep -q 'wall_running' characters/player_controller.gd
          grep -q 'margerina_v033.json' systems/hub_manager.gd
          test -s docs/V041_FEATURES.md

      - name: Install Godot 4.4.1 with Web export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Validate Godot import and 120 frame startup
        shell: bash
        run: |
          set -euo pipefail
          godot --version
          godot --headless --path . --editor --import --quit 2>&1 | tee v041-import.log
          if grep -E 'ERROR:|SCRIPT ERROR:|Parse Error' v041-import.log; then exit 1; fi
          godot --headless --path . --quit-after 120 2>&1 | tee v041-startup.log
          if grep -E 'ERROR:|SCRIPT ERROR:|Parse Error' v041-startup.log; then exit 1; fi

      - name: Export and verify playable Godot browser game
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/web
          godot --headless --path . --export-release Web build/web/index.html 2>&1 | tee v041-export.log
          if grep -E 'ERROR:|SCRIPT ERROR:|Parse Error' v041-export.log; then exit 1; fi
          for ext in html js wasm pck; do
            test -s "build/web/index.$ext" || { echo "Missing index.$ext"; exit 1; }
          done
          ls -lh build/web/

      - name: Commit only validated V0.41 source on development branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add characters/player_controller.gd systems/hub_manager.gd scenes/main.tscn world/ring_two_daily_life.gd docs/V041_FEATURES.md
          if ! git diff --cached --quiet; then
            git commit -m 'V0.41 add canon-aware Ring Two NPC duties and visitor journal'
            git pull --rebase origin codex-modular-v31
            git push origin HEAD:codex-modular-v31
          else
            echo 'V0.41 already installed; no gameplay changes'
          fi

      - name: Upload playable V0.41 Web ZIP for itch.io
        uses: actions/upload-artifact@v4
        with:
          name: seeker-codex-v041-web
          path: build/web/
          if-no-files-found: error

      - name: Save debugging logs if a validation stage fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: margerina-v041-debug-logs
          if-no-files-found: ignore
          path: |
            v041-import.log
            v041-startup.log
            v041-export.log
