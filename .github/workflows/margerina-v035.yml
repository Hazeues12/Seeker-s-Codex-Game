name: Margerina V0.35 Real Combat Sandbox

on:
  push:
    branches:
      - codex-modular-v31
    paths:
      - '.github/workflows/margerina-v035.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: margerina-v035-${{ github.ref }}
  cancel-in-progress: false

