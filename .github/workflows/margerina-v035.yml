          # Decode only known text files from this embedded, trusted upgrade.
          bundle = base64.b64decode(encoded)
          with tarfile.open(fileobj=io.BytesIO(bundle), mode='r:gz') as archive:
              allowed = {'install_v035.py', 'combat/sparring_construct.gd',
                         'combat/combat_arena.gd', 'docs/V035_FEATURES.md'}
              names = {item.name for item in archive.getmembers()}
              if names != allowed:
                  raise SystemExit('Unexpected upgrade files')
              for item in archive.getmembers():
                  if not item.isfile():
                      raise SystemExit('Unexpected non-file member')
                  target = pathlib.Path(item.name)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  stream = archive.extractfile(item)
                  if stream is None:
                      raise SystemExit('Missing upgrade file')
                  contents = stream.read().decode('utf-8')
                  if target.exists() and target.read_text() != contents:
                      raise SystemExit(f'Conflicting existing file: {target}')
                  target.write_text(contents)
          PYCODE
          python3 install_v035.py
          rm install_v035.py
          grep -q 'func player_strike' combat/combat_arena.gd
          grep -q 'func take_strike' combat/sparring_construct.gd
          grep -q 'get_first_node_in_group("combat_arena")' characters/player_controller.gd

      - name: Install Godot 4.4.1 with browser export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Validate import and 120-frame game startup
        shell: bash
        run: |
          set -euo pipefail
          godot --version
          godot --headless --path . --editor --import --quit 2>&1 | tee v035-import.log
          if grep -E 'ERROR:|SCRIPT ERROR:|Parse Error' v035-import.log; then exit 1; fi
          godot --headless --path . --quit-after 120 2>&1 | tee v035-startup.log
          if grep -E 'ERROR:|SCRIPT ERROR:|Parse Error' v035-startup.log; then exit 1; fi

      - name: Export V0.35 HTML5 game for itch.io
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/web
          godot --headless --path . --export-release Web build/web/index.html 2>&1 | tee v035-export.log
          for ext in html js wasm pck; do
            test -s "build/web/index.$ext" || { echo "Missing index.$ext"; exit 1; }
          done
          ls -lh build/web/

      - name: Commit verified V0.35 to development branch (never main)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add characters/player_controller.gd scenes/main.tscn combat/combat_arena.gd combat/sparring_construct.gd docs/V035_FEATURES.md
          if ! git diff --cached --quiet; then
            git commit -m 'V0.35 add enemy AI and Martial sparring combat'
            git pull --rebase origin codex-modular-v31
            git push origin HEAD:codex-modular-v31
          else
            echo 'V0.35 already installed, no change to source.'
          fi

      - name: Upload verified V0.35 Web files (GitHub provides ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: seeker-codex-v035-web
          path: build/web/
          if-no-files-found: error

      - name: Save build failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: margerina-v035-debug-logs
          if-no-files-found: ignore
          path: |
            v035-import.log
            v035-startup.log
            v035-export.log
