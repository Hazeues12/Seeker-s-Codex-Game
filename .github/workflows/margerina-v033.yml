name: Margerina V0.33 Starter Hub

on:
  push:
    branches:
      - codex-modular-v31
    paths:
      - .github/workflows/margerina-v033.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-v033:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development branch only
        uses: actions/checkout@v4
        with:
          ref: codex-modular-v31
          persist-credentials: true

