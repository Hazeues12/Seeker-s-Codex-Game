      - name: Install Godot 4.4.1 and Web export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Validate new scenes and gameplay scripts
        shell: bash
        run: |
          set -o pipefail
          test -s systems/hub_manager.gd
          test -s scenes/main.tscn
          test -s project.godot
          godot --headless --path . --editor --import --quit 2>&1 | tee import-v033.log
          if grep -E 'ERROR:|SCRIPT ERROR:|Parse Error' import-v033.log; then exit 1; fi
          godot --headless --path . --quit-after 35 2>&1 | tee startup-v033.log
          if grep -E 'ERROR:|SCRIPT ERROR:|Parse Error' startup-v033.log; then exit 1; fi

      - name: Export HTML5 iPhone-compatible prototype
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/web
          godot --headless --path . --export-release Web build/web/index.html 2>&1 | tee export-v033.log
          for file in index.html index.js index.wasm index.pck; do
            test -s "build/web/$file" || { echo "Missing $file"; exit 1; }
          done
          ls -lh build/web/

      - name: Save V0.33 browser build
        uses: actions/upload-artifact@v4
        with:
          name: seeker-codex-v033-web
          path: build/web/
          if-no-files-found: error

      - name: Save logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: seeker-codex-v033-logs
          if-no-files-found: ignore
          path: |
            import-v033.log
            startup-v033.log
            export-v033.log
